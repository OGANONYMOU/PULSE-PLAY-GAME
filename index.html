<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PulsePay — Nigeria's premier mobile gaming tournament platform. Compete, win, and connect with the gaming community." />
    <meta name="theme-color" content="#0a0a12" />

    <!-- Preconnect to external origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — non-render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" />
    </noscript>

    <!-- Critical inline styles — prevents dark flash before CSS bundle loads -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: hsl(240 20% 4%); overflow-x: hidden; }
      body {
        background: hsl(240 20% 4%);
        color: #fff;
        overflow-x: hidden;
        font-family: 'Space Mono', 'Courier New', monospace;
        -webkit-text-size-adjust: 100%;
      }
      #root { min-height: 100dvh; display: flex; flex-direction: column; }
    </style>

    <!-- Emoji favicon — zero network request -->
    <link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />

    <title>PulsePay — Gaming Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
